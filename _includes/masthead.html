<header class="masthead" role="banner">
  <div class="new-masthead">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Stephen Byrne, home">
      <span class="brand__mark">SB<span class="brand__dot">.</span></span>
      <span class="brand__label">Stephen Byrne <small>Economist</small></span>
    </a>
    <nav class="new-nav" aria-label="Primary navigation">
      {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
